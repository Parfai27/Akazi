services:
  - type: web
    name: akazi
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install --include=dev && npm run crawl && rm -rf .next && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADSENSE_CLIENT
        value: ca-pub-5649671721567993
      - key: ADSENSE_SLOT
        sync: false
