services:
  - type: web
    name: akazi
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install --include=dev && npm run crawl && rm -rf .next && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SITE_URL
        value: https://akazi.co.rw
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADSENSE_CLIENT
        value: ca-pub-5649671721567993
      - key: ADSENSE_SLOT
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: mugwanezaparfait@gmail.com
      - key: MAIL_FROM
        value: "Akazi <mugwanezaparfait@gmail.com>"
      - key: SMTP_PASS
        sync: false
      - key: MAIL_HOOK_URL
        sync: false
      - key: MAIL_HOOK_SECRET
        sync: false
